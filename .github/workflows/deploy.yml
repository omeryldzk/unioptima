name: Deploy to Google Compute Engine

on:
  push:
    branches: [ "master" ]
    paths-ignore: [ 'README.md' ]
  pull_request:
    branches: [ master ]
    paths-ignore: [ 'README.md' ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: "."
          target: "/home/${{ secrets.GCP_USERNAME }}/app"
          rm: true 

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            cd /home/${{ secrets.GCP_USERNAME }}/app/ml-inference-platform
            
            # Stop existing containers (optional, ensures clean state)
            docker compose down --remove-orphans
            
            # Build and start the services
            # We use --build to ensure code changes in 'context: .' are picked up
            docker compose up -d --build

            # Cleanup unused images to save disk space on the VM
            docker image prune -f