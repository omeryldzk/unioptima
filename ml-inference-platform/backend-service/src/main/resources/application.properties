spring.application.name=backend-service
spring.main.allow-bean-definition-overriding=true

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# gRPC Client Configuration
# PATTERN: static://${HOST}:${PORT}
# 1. Use 'static://' protocol for direct addressing
# 2. Inject host and port via environment variables
grpc.client.my-inference-service.address=static://${INFERENCE_SERVICE_HOST:localhost}:${INFERENCE_SERVICE_PORT:50051}
grpc.client.my-inference-service.negotiation-type=plaintext

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
typesense.protocol=${TYPESENSE_PROTOCOL:http}
typesense.host=${TYPESENSE_HOST:localhost}
typesense.port=${TYPESENSE_PORT:8108}
typesense.api-key=${TYPESENSE_API_KEY:xyz_typesense_api_key_123}
management.endpoints.web.exposure.include=health,info,mappings
