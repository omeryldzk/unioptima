server {
    listen 80;

    # This server's only job is to serve the static files for the React app.
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # This line is crucial for React Router to work correctly.
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression for performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff2;
}