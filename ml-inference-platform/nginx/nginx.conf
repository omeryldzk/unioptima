# ./nginx/nginx.conf

server {
    listen 80;
    server_name localhost; # Replace with your actual domain

    # Rule 1: If the request path starts with /api, send it to the backend.
    location /api/ {
        # The magic is here: Docker's internal DNS resolves 'backend' to the
        # IP address of the backend container. 8080 is the port backend-service runs on
        # INSIDE its container.
        proxy_pass http://backend-service:8080;

        # Standard headers to pass along client info to the backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout configurations for long-running optimization requests
        proxy_read_timeout 300s;      # 5 minutes for reading response
        proxy_connect_timeout 60s;    # 1 minute for connection
        proxy_send_timeout 300s;      # 5 minutes for sending request
    }

    location /actuator/ {
        proxy_pass http://backend-service:8080/actuator/;
    }


    # Rule 2: For ALL OTHER requests, send them to the frontend.
    location / {
        # Docker's internal DNS resolves 'frontend' to the frontend container's IP.
        # Inside that container, Nginx is listening on port 80.
        proxy_pass http://frontend:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}